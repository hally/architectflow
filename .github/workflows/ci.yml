name: ArchitectFlow CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - name: Terraform formatting
        run: terraform fmt -check -recursive terraform/
      - name: Validate secure-storage module (no AWS access)
        run: |
          terraform -chdir=terraform/modules/secure-storage init -backend=false -input=false
          terraform -chdir=terraform/modules/secure-storage validate
      - name: Validate AWS platform (no AWS access)
        run: |
          terraform -chdir=terraform/aws-platform init -backend=false -input=false
          terraform -chdir=terraform/aws-platform validate

  opa:
    name: OPA policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Test request governance policies
        run: opa test policies/request/ -v
      - name: Test Terraform governance policies
        run: opa test policies/terraform/ -v

  python:
    name: Python syntax and LangGraph tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "langgraph>=1.0,<2.0" "Flask>=3.1,<4.0" -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q portal services scripts tests
      - name: Run architecture planner tests
        run: python -m unittest discover -s tests -v
